services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlcc
      POSTGRES_USER: mlcc
      POSTGRES_PASSWORD: mlcc
    volumes:
      - mlcc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlcc -d mlcc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4100
      WEB_ORIGIN: http://localhost:8080
      JWT_SECRET: docker-demo-secret-change-in-production
      DATABASE_URL: postgresql://mlcc:mlcc@postgres:5432/mlcc
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TICK_MS: 900
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4100/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlcc_postgres:
